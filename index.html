<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبكة السنن القرأنية</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #f8fafc; color: #1e293b; }
        #sidebar { width: 360px; background: #ffffff; border-left: 1px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: -2px 0 10px rgba(0,0,0,0.05); z-index: 10; overflow-y: auto; }
        #network-container { flex: 1; height: 100%; position: relative; }
        #mynetwork { width: 100%; height: 100%; }
        h2 { color: #0f172a; font-size: 1.25rem; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
        .search-box { display: flex; flex-direction: column; gap: 5px; }
        select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; background: #fff; }
        .info-card { background: #f1f5f9; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .info-title { font-weight: bold; color: #1e3a8a; font-size: 1.1rem; }
        .info-item { font-size: 0.9rem; line-height: 1.5; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; background: #3b82f6; color: white; margin-left: 5px; }
        #status-msg { color: #64748b; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>شبكة السنن القرأنية</h2>
        
        <div class="search-box">
            <label for="sunan-select"><b>البحث عن سنة:</b></label>
            <select id="sunan-select">
                <option value="">جاري تحميل القائمة...</option>
            </select>
        </div>

        <div id="status-msg">جارٍ الاتصال بملف البيانات...</div>

        <div id="details-panel" class="info-card" style="display: none;">
            <div id="node-title" class="info-title"></div>
            <div>
                <span id="node-domain" class="badge"></span>
                <span id="node-level" class="badge" style="background:#10b981;"></span>
            </div>
            <div id="node-def" class="info-item"></div>
            <hr style="border: 0; border-top: 1px solid #cbd5e1;">
            <div id="node-cause-in" class="info-item"></div>
            <div id="node-cause-proc" class="info-item"></div>
            <div id="node-cause-out" class="info-item"></div>
        </div>
    </div>

    <div id="network-container">
        <div id="mynetwork"></div>
    </div>

    <script>
        let network = null;
        let nodesDataSet = null;

        async function initGraph() {
            const statusEl = document.getElementById('status-msg');
            const selectEl = document.getElementById('sunan-select');

            try {
                statusEl.textContent = "جاري قراءة ملف البيانات...";
                const response = await fetch('sunan_data.json');
                
                if (!response.ok) {
                    throw new Error(`تعذر تحميل الملف (رمز الخطأ: ${response.status})`);
                }

                const data = await response.json();

                if (!data.nodes || !Array.isArray(data.nodes)) {
                    throw new Error("تنسيق JSON لا يحتوي على مصفوفة nodes صحيحة");
                }

                // معالجة العُقد بصورة مرنة
                // معالجة العُقد بصورة مرنة
                const formattedNodes = data.nodes.map(node => {
                    const labelText = node.label || node.title || node.id;
                    return {
                        id: node.id,
                        label: labelText.length > 30 ? labelText.substring(0, 30) + '...' : labelText,
                        title: node.title || labelText,
                        raw: node,
                        shape: 'dot',
                        size: 16,
                        font: { size: 14, face: 'system-ui' }
                    };
                });

                // معالجة الروابط
                const formattedEdges = (data.edges || []).map(edge => ({
                    from: edge.from,
                    to: edge.to,
                    label: edge.label || '',
                    arrows: 'to',
                    font: { size: 10, align: 'middle' },
                    color: { color: '#94a3b8' }
                }));

                nodesDataSet = new vis.DataSet(formattedNodes);
                const edgesDataSet = new vis.DataSet(formattedEdges);

                const container = document.getElementById('mynetwork');
                const graphData = { nodes: nodesDataSet, edges: edgesDataSet };

                const options = {
                    nodes: { color: { background: '#3b82f6', border: '#1d4ed8', highlight: { background: '#ef4444', border: '#b91c1c' } } },
                    physics: { barnesHut: { gravitationalConstant: -3000, springLength: 95 } },
                    interaction: { hover: true, tooltipDelay: 200 }
                };

                network = new vis.Network(container, graphData, options);

                // ملء القائمة المنسدلة
                selectEl.innerHTML = '<option value="">-- اختر سنة من القائمة (' + formattedNodes.length + ' سنة) --</option>';
                data.nodes.forEach(node => {
                    const opt = document.createElement('option');
                    opt.value = node.id;
                    opt.textContent = `${node.id}: ${node.title || node.label}`;
                    selectEl.appendChild(opt);
                });

                statusEl.textContent = `تم تحميل ${formattedNodes.length} سنة بنجاح!`;

                // التفاعل عند النقر
                network.on("selectNode", function (params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        selectEl.value = nodeId;
                        displayNodeDetails(nodeId, data.nodes);
                    }
                });

                selectEl.addEventListener('change', function () {
                    const nodeId = this.value;
                    if (nodeId) {
                        network.selectNodes([nodeId]);
                        network.focus(nodeId, { scale: 1.2, animation: true });
                        displayNodeDetails(nodeId, data.nodes);
                    }
                });

            } catch (err) {
                console.error(err);
                statusEl.style.color = 'red';
                statusEl.textContent = "حدث خطأ: " + err.message;
                selectEl.innerHTML = '<option value="">فشل التحميل</option>';
            }
        }

        function displayNodeDetails(nodeId, rawNodes) {
            const panel = document.getElementById('details-panel');
            const node = rawNodes.find(n => n.id === nodeId);

            if (!node) return;

            panel.style.display = 'flex';
            document.getElementById('node-title').textContent = node.title || node.label || node.id;
            document.getElementById('node-domain').textContent = node.domain || 'عام';
            document.getElementById('node-level').textContent = node.level || 'سنّة';
            document.getElementById('node-def').innerHTML = `<b>التعريف:</b> ${node.definition || 'لا يوجد تعريف متاح'}`;
            
            document.getElementById('node-cause-in').innerHTML = node.cause_input ? `<b>المُدخلات:</b> ${node.cause_input}` : '';
            document.getElementById('node-cause-proc').innerHTML = node.cause_process ? `<b>المعالجة والتدافع:</b> ${node.cause_process}` : '';
            document.getElementById('node-cause-out').innerHTML = node.cause_output ? `<b>المخرجات والأثر:</b> ${node.cause_output}` : '';
        }

        window.addEventListener('DOMContentLoaded', initGraph);
    </script>
</body>
</html>
